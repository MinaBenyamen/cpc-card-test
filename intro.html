*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden;position:fixed;inset:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.bg,.dim{position:fixed;inset:0;z-index:0}
.bg{inset:-6%;background:var(--ground) var(--photo) center 55%/cover no-repeat;animation:drift 26s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-2%,-3%,0)}}
.dim{background:var(--dim)}

.page{position:relative;z-index:1;height:100vh;height:100svh;height:var(--app-h,100svh);max-width:440px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(8px,2vh,24px) calc(clamp(10px,2vh,20px) + max(env(safe-area-inset-bottom,0px), var(--bar,0px)))}

.page > *{flex-shrink:0}
/* header */
.head{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{display:block;width:100%;max-width:270px;height:auto;max-height:clamp(54px,10.5vh,106px)}
.logo .lg-ink,.logo .lg-ink g{fill:var(--logo-ink)}
.logo .lg-ink2{fill:var(--logo-ink2)}
.logo .lg-lane{fill:#26221F}                 /* dark version: light road, dark lane markings */
:root[data-mode="light"] .logo .lg-lane{fill:#FFFFFF}
.slogan{margin:2px 0 0;font-size:clamp(14px,2.1vh,18px);font-weight:700;letter-spacing:-.01em;text-align:center;text-wrap:balance}
.mode{all:unset;cursor:pointer;position:absolute;top:-6px;right:-6px;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--fg);
  background:var(--chipBg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s}
.mode:active{transform:scale(.94)}
.mode:focus-visible{outline:2px solid var(--acc)}
.mode svg{width:17px;height:17px}
.sun{display:block}.moon{display:none}
:root[data-mode="light"] .sun{display:none}:root[data-mode="light"] .moon{display:block}

/* glass + motion, as in the accounts system */
.glass{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad);
  backdrop-filter:blur(var(--blur)) saturate(140%);-webkit-backdrop-filter:blur(var(--blur)) saturate(140%);box-shadow:var(--shadow)}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) backwards}
@keyframes rise{from{opacity:.2;transform:translateY(26px) scale(.965);filter:blur(5px)}60%{filter:blur(0)}to{opacity:1;transform:none;filter:none}}
.card3d{position:relative;overflow:hidden;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--sc,1));
  transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s;will-change:transform}
.card3d.hot{--ty:-4px;transition:transform .14s ease-out,box-shadow .45s,border-color .45s;border-color:var(--acc);box-shadow:var(--shadow),0 22px 44px -12px rgba(220,100,0,.38)}
.card3d:active{--sc:.97}
.card3d::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--glare),transparent 46%);opacity:0;transition:opacity .4s}
.card3d.hot::before{opacity:1}
.card3d::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(105deg,transparent 38%,var(--sweep) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:160% 0;
  animation:sweep 6s cubic-bezier(.4,0,.2,1) .6s infinite}
@keyframes sweep{0%{background-position:160% 0}28%,100%{background-position:-60% 0}}

/* actions */
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.c{display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0;min-height:clamp(42px,6.6vh,56px)}
.c.wide{grid-column:1 / -1;padding-inline:12px}
.ico-tile{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--chipBg);color:var(--fg);
  transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card3d.hot .ico-tile{transform:scale(1.12) rotate(-6deg)}
.ico-tile svg{width:18px;height:18px}
.c .tx{display:flex;flex-direction:column;min-width:0;gap:1px}
.c b{font-size:14.5px;font-weight:700;letter-spacing:-.005em;line-height:1.15}
.c small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c.wa{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(220,100,0,.34)}
.c.wa small{color:rgba(255,255,255,.86)}
.c.wa .ico-tile{background:rgba(255,255,255,.22);color:#fff}
.c .go{margin-left:auto;flex:none;opacity:.6}
.c .go svg{width:18px;height:18px;display:block}

/* find us */
.find{padding:clamp(8px,1.4vh,14px) 14px;display:flex;flex-direction:column;gap:clamp(6px,1.1vh,12px)}
.find h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.map{position:relative;display:block;height:clamp(64px,14vh,150px);border-radius:14px;overflow:hidden;border:1px solid var(--bord);background:var(--chipBg)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.map .fb{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:14px}
.map .fb .pin{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--acc);color:#fff;box-shadow:0 0 0 8px rgba(220,100,0,.16)}
.map .fb .pin svg{width:22px;height:22px}
.map .fb b{display:block;font-size:15px}
.map .fb small{display:block;font-size:13px;color:var(--muted)}
.social{display:flex;gap:8px}
.ico{all:unset;cursor:pointer;width:clamp(34px,5.4vh,42px);height:clamp(34px,5.4vh,42px);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);
  background:var(--chipBg);transition:background .2s,transform .15s,color .2s}
.ico:hover{color:var(--accText)}
.ico:active{transform:scale(.94)}
.ico:focus-visible{outline:2px solid var(--acc)}
.ico svg{width:19px;height:19px}
.addr{font-size:13px;line-height:1.5;color:var(--muted)}
.addr b{color:var(--fg);font-weight:600}

/* bottom */
.foot{margin:0;padding:clamp(8px,1.3vh,12px) 14px;border-radius:18px;text-align:center;background:var(--bar);color:var(--barFg);border:1px solid var(--bord);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.foot .ad{font-size:11px;opacity:.82;line-height:1.4}
.foot .ad span{white-space:nowrap}
.foot .nm{font-size:12.5px;font-weight:700;letter-spacing:.02em;margin-top:2px}

.rpl::after{content:"";position:absolute;left:var(--px,50%);top:var(--py,50%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:currentColor;opacity:.3;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(30);opacity:0}}
@media (prefers-reduced-motion: reduce){.rise,.card3d::after{animation:none}.card3d{transition:none}}
/* road strip: asphalt between two edge lines, lane dashes driving across */
.road{position:relative;flex:none;height:clamp(14px,2.4vh,24px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  background:linear-gradient(#3C3C3C,#2F2F2F);overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.road::before,.road::after{content:"";position:absolute;left:0;right:0;height:2px}
.road::before{top:3px;background:rgba(255,255,255,.85)}
.road::after{bottom:3px;background:var(--acc)}
.road i{position:absolute;left:0;top:50%;width:calc(100% + 64px);height:3px;margin-top:-1.5px;
  background:repeating-linear-gradient(90deg,#FFFFFF 0 30px,transparent 30px 64px);animation:drive 1.1s linear infinite}
@keyframes drive{from{transform:translateX(-64px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){.road i{animation:none}}

/* ===== opening intro (proposal v2): night drive -> light rises bottom-to-top -> logo builds part by part -> flies to the header ===== */
.intro{position:fixed;inset:0;z-index:50;background:#0B0908;overflow:hidden;transition:background-color .6s ease,opacity .5s ease}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.intro .ilogo{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.intro .part{position:absolute;inset:0;opacity:0;will-change:transform,opacity,clip-path}
.intro .part svg,.intro .sizer svg{display:block;width:100%!important;height:auto!important;max-width:none!important;max-height:none!important}
.intro .ilogo .sizer{visibility:hidden}
.intro .ilogo .sizer svg{display:block;width:100%;height:auto}
.intro .beam{position:absolute;left:0;top:0;width:100%;height:24%;pointer-events:none;opacity:0;z-index:2;
  background:linear-gradient(to top,rgba(255,170,80,0) 0%,rgba(255,200,140,.95) 55%,rgba(255,236,205,1) 62%,rgba(255,170,80,0) 100%);filter:blur(6px)}
.intro .glowhead{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);background:#FFF4E2;box-shadow:0 0 10px 4px rgba(255,230,190,.95),0 0 28px 12px rgba(255,150,40,.75),0 0 60px 26px rgba(220,100,0,.35)}
.intro .skip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + max(env(safe-area-inset-bottom,0px), var(--bar,0px)));
  font:600 13px var(--font);color:rgba(255,255,255,.75);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  padding:7px 14px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
html.intro-on .head .logo{visibility:hidden}
html.intro-on .head.rise,html.intro-done .head.rise{animation:none;opacity:1;transform:none;filter:none}   /* the header must stand still while the logo lands in it */
html.intro-on .rise{animation-play-state:paused}
html.intro-on .page{opacity:0}
html.intro-done .page{opacity:1;transition:opacity .5s ease}
html.intro-done .rise{animation-play-state:running}

/* header after landing: a headlight streak crosses behind the logo every 7 s, and a soft glow breathes under it */
.head::before{content:"";position:absolute;left:-30%;right:-30%;top:34%;height:2px;pointer-events:none;z-index:-1;
  background:linear-gradient(90deg,transparent 0,rgba(255,236,205,0) 35%,rgba(255,236,205,.95) 50%,rgba(255,170,80,0) 65%,transparent 100%);
  background-size:220% 100%;background-position:120% 0;animation:streak 7s cubic-bezier(.45,0,.2,1) 1.2s infinite;filter:drop-shadow(0 0 6px rgba(255,150,40,.9))}
@keyframes streak{0%{background-position:120% 0;opacity:0}6%{opacity:1}22%{background-position:-20% 0;opacity:1}26%,100%{background-position:-20% 0;opacity:0}}
.head::after{content:"";position:absolute;left:50%;top:30%;width:70%;height:46%;transform:translate(-50%,-50%);pointer-events:none;z-index:-1;border-radius:50%;
  background:radial-gradient(closest-side,rgba(220,100,0,.28),rgba(220,100,0,0));animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.head{isolation:isolate}
@media (prefers-reduced-motion: reduce){.head::before,.head::after{animation:none;opacity:0}}


/* ambient motion — runs by itself on phones (no mouse needed) */
.acts .card3d:nth-child(2)::after{animation-delay:1.4s}
.acts .card3d:nth-child(3)::after{animation-delay:2.2s}
.acts .card3d:nth-child(4)::after{animation-delay:3s}
.acts .card3d:nth-child(5)::after{animation-delay:3.8s}
.find.card3d::after{animation-delay:4.6s}
.ico-tile svg{transform-origin:50% 50%;animation:nudge 5s ease-in-out infinite}
.acts .c:nth-child(1) .ico-tile svg{animation-name:ring;animation-delay:1s}
.acts .c:nth-child(2) .ico-tile svg{animation-delay:1.8s}
.acts .c:nth-child(4) .ico-tile svg{animation-delay:2.6s}
.acts .c:nth-child(5) .ico-tile svg{animation-name:spin;animation-delay:3.4s}
@keyframes nudge{0%,14%,100%{transform:none}4%{transform:translateY(-3px) scale(1.12)}9%{transform:translateY(1px)}}
@keyframes ring{0%,16%,100%{transform:none}2%,6%,10%{transform:rotate(-14deg)}4%,8%,12%{transform:rotate(14deg)}}
@keyframes spin{0%,20%,100%{transform:none}14%{transform:rotate(360deg)}}
.c.wa{animation:rise .8s cubic-bezier(.16,1,.3,1) backwards,waglow 2.8s ease-in-out 1.2s infinite}
@keyframes waglow{0%,100%{box-shadow:0 8px 22px rgba(220,100,0,.30),0 0 0 0 rgba(220,100,0,.45)}50%{box-shadow:0 10px 30px rgba(220,100,0,.5),0 0 0 7px rgba(220,100,0,0)}}
.c.wa .ico-tile{position:relative}
.c.wa .ico-tile::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(255,255,255,.8);animation:ping 2.8s ease-out 1.2s infinite}
@keyframes ping{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(1.7);opacity:0}}
.c.wa .go{animation:go 1.6s ease-in-out infinite}
@keyframes go{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.slogan{background:linear-gradient(100deg,var(--fg) 0%,var(--fg) 40%,var(--acc) 50%,var(--fg) 60%,var(--fg) 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out 1s infinite}
@keyframes shine{0%,55%{background-position:100% 0}85%,100%{background-position:0 0}}
.logo .lg-lane{animation:lane 1.4s linear infinite;animation-delay:calc(var(--i) * -55ms)}
@keyframes lane{0%,100%{opacity:1}50%{opacity:.18}}
.find h2{display:flex;align-items:center;gap:9px}
.live{position:relative;width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--acc);animation:ping 2s ease-out infinite}
.social .ico{animation:bob 4s ease-in-out infinite}
.social .ico:nth-child(2){animation-delay:.25s}.social .ico:nth-child(3){animation-delay:.5s}
@keyframes bob{0%,20%,100%{transform:none}8%{transform:translateY(-4px)}}
.map .fb .pin{animation:pinb 2.4s ease-in-out infinite}
@keyframes pinb{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}60%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.bg,.ico-tile svg,.c.wa,.c.wa .ico-tile::after,.c.wa .go,.slogan,.logo .lg-lane,.live::after,.social .ico,.map .fb .pin{animation:none!important}.slogan{color:var(--fg);background:none}}

<script>
(function(){
  var root = document.documentElement;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  try { if (localStorage.getItem("cpc-card-mode") === "light") root.setAttribute("data-mode", "light"); } catch(e){}


  /* fit to the visible phone screen (Safari bars included) */
  var page = document.querySelector(".page");
  /* iPhone with iOS 26 Safari (and links opened from apps in its Safari view): the bottom toolbar floats OVER the page
     and innerHeight runs under it, so keep the content above it. Test override: #bar=NN (px). */
  (function(){
    var ua = navigator.userAgent, v = +((ua.match(/Version\/(\d+)/) || [])[1] || 0), m = location.hash.match(/bar=(\d+)/);
    if (m) root.style.setProperty("--bar", m[1] + "px");
    else if (/iPhone|iPod/.test(ua) && v >= 26) root.style.setProperty("--bar", "76px");
  })();
  function fit(){
    var H = window.innerHeight;                       /* the part of the screen you actually see (browser bars excluded) */
    root.style.setProperty("--app-h", H + "px");
    page.style.zoom = ""; page.style.height = "";
    page.style.justifyContent = "flex-start";          /* measure the content packed tight */
    var foot = page.querySelector(".foot");
    var need = foot.offsetTop + foot.offsetHeight + parseFloat(getComputedStyle(page).paddingBottom);
    page.style.justifyContent = "";
    if (need > H){ var z = H / need; page.style.zoom = z; page.style.height = (H / z) + "px"; }   /* still too tall: scale the whole page down */
  }
  fit(); window.addEventListener("resize", fit); window.addEventListener("orientationchange", function(){ setTimeout(fit, 250); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* click sounds — same synthesis as the accounts system */
  var ac = null, nb = null;
  function snd(kind){
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = ac || new AC(); if (ac.state === "suspended") ac.resume();
      var c = ac, t = c.currentTime + 0.005;
      if (!nb){ var len = Math.floor(c.sampleRate*0.25); nb = c.createBuffer(1,len,c.sampleRate); var d = nb.getChannelData(0); for (var i=0;i<len;i++) d[i] = Math.random()*2-1; }
      var out = c.createGain(); out.gain.value = 0.45; out.connect(c.destination);
      function noise(st,dur,f,q,g){ var s=c.createBufferSource(); s.buffer=nb; var bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f; bp.Q.value=q; var e=c.createGain(); e.gain.setValueAtTime(0.0001,st); e.gain.exponentialRampToValueAtTime(g,st+0.0015); e.gain.exponentialRampToValueAtTime(0.0001,st+dur); s.connect(bp); bp.connect(e); e.connect(out); s.start(st); s.stop(st+dur+0.02); }
      function tone(st,dur,f0,f1,g){ var o=c.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f0,st); if(f1) o.frequency.exponentialRampToValueAtTime(f1,st+dur); var e=c.createGain(); e.gain.setValueAtTime(0.0001,st); e.gain.exponentialRampToValueAtTime(g,st+0.004); e.gain.exponentialRampToValueAtTime(0.0001,st+dur); o.connect(e); e.connect(out); o.start(st); o.stop(st+dur+0.02); }
      if (kind === "ok"){ tone(t,0.09,880,1320,0.16); tone(t+0.08,0.14,1320,1760,0.12); }
      else if (kind === "swoosh"){ noise(t,0.28,900,0.7,0.35); }
      else { noise(t,0.035,3800,1.4,0.55); tone(t,0.05,1700,1250,0.12); }
    } catch(e){}
  }
  document.addEventListener("pointerdown", function(e){
    var el = e.target.closest ? e.target.closest("[data-snd]") : null;
    if (el) snd(el.getAttribute("data-snd") || "tap");
    var r = e.target.closest ? e.target.closest(".c.wa") : null;
    if (r){ var b = r.getBoundingClientRect(); r.style.setProperty("--px",(e.clientX-b.left)+"px"); r.style.setProperty("--py",(e.clientY-b.top)+"px"); r.classList.remove("rpl"); void r.offsetWidth; r.classList.add("rpl"); }
  });

  document.getElementById("mode").addEventListener("click", function(){
    var light = root.getAttribute("data-mode") === "light";
    if (light) root.removeAttribute("data-mode"); else root.setAttribute("data-mode", "light");
    snd("swoosh");
    try { localStorage.setItem("cpc-card-mode", light ? "dark" : "light"); } catch(e){}
  });

  /* 3D tilt + glare, as in the accounts system */
  var hot = null;
  function cool(el){ if(!el) return; el.classList.remove("hot"); el.style.removeProperty("--rx"); el.style.removeProperty("--ry"); }
  document.addEventListener("pointermove", function(e){
    var el = e.target && e.target.closest ? e.target.closest(".card3d") : null;
    if (hot && hot !== el){ cool(hot); hot = null; }
    if (!el || e.pointerType === "touch") return;
    var r = el.getBoundingClientRect(); if (!r.width) return;
    var x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
    el.style.setProperty("--mx",(x*100).toFixed(1)+"%"); el.style.setProperty("--my",(y*100).toFixed(1)+"%");
    if (!reduce){ el.style.setProperty("--rx",((0.5-y)*7).toFixed(2)+"deg"); el.style.setProperty("--ry",((x-0.5)*9).toFixed(2)+"deg"); }
    el.classList.add("hot"); hot = el;
  }, {passive:true});
  document.addEventListener("pointerout", function(e){ if (!e.relatedTarget && hot){ cool(hot); hot = null; } }, {passive:true});
  document.addEventListener("touchstart", function(e){ var el = e.target.closest && e.target.closest(".card3d"); if (el){ el.classList.add("hot"); setTimeout(function(){ el.classList.remove("hot"); }, 260); } }, {passive:true});

  /* ===== opening intro v2 ===== */
  (function(){
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var seen = false; try { seen = sessionStorage.getItem("cpc-intro") === "1"; } catch(e){}
    var box = document.getElementById("intro");
    if (reduce || seen || !box || !window.requestAnimationFrame) return;
    var cv = document.getElementById("road"), ctx = cv.getContext("2d");
    var beam = document.getElementById("beam"), il = document.getElementById("ilogo"), gh = document.getElementById("glowhead");
    var headLogo = document.querySelector(".head .logo");
    document.getElementById("sizer").appendChild(headLogo.cloneNode(true));
    /* the mark split into its parts (insets in % of the logo box: top right bottom left) */
    var PARTS = {
      sw: [0, 82.18, 0, 0], c1: [2.29, 55, 40.9, 18.18], p: [2.29, 26.36, 40.9, 45], c2: [2.29, 0, 40.9, 73.64],
      ar: [59.34, 0, 24.97, 17.82], en: [75.6, 0, 10.65, 17.82]
    };
    var el = {};
    Object.keys(PARTS).forEach(function(k){
      var d = document.createElement("div"); d.className = "part";
      d.appendChild(headLogo.cloneNode(true)); il.insertBefore(d, gh); el[k] = d;
    });
    function clip(k, extraTop){ var p = PARTS[k]; return "inset(" + Math.max(p[0], extraTop || 0) + "% " + p[1] + "% " + p[2] + "% " + p[3] + "%)"; }
    Object.keys(el).forEach(function(k){ el[k].style.clipPath = el[k].style.webkitClipPath = clip(k); });
    root.classList.add("intro-on"); box.hidden = false;
    var dpr = Math.min(window.devicePixelRatio || 1, 2), Wc, Hc;
    function size(){ Wc = cv.clientWidth; Hc = cv.clientHeight; cv.width = Wc * dpr; cv.height = Hc * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    size(); window.addEventListener("resize", size);
    var t0 = null, done = false;
    /* timeline (s) */
    var DRIVE = 1.7, RISE = 2.75, SW0 = 2.55, SW1 = 3.25, L0 = 3.05, AR0 = 3.7, EN0 = 3.9, FLY = 4.5, END = 5.25;
    var FIX = (location.hash.match(/introt=([\d.]+)/) || [])[1];   /* review aid: #introt=2.3 freezes the intro at that second */
    function ease(x){ x = Math.min(Math.max(x,0),1); return 1 - Math.pow(1-x,3); }
    function back(x){ x = Math.min(Math.max(x,0),1); var s = 1.5; return 1 + (s+1)*Math.pow(x-1,3) + s*Math.pow(x-1,2); }
    function prog(t,a,b){ return Math.min(Math.max((t-a)/(b-a),0),1); }
    function road(t){
      var hy = Hc*0.46, cx = Wc/2;
      var g = ctx.createLinearGradient(0,0,0,hy); g.addColorStop(0,"#0B0908"); g.addColorStop(1,"#3A1B05");
      ctx.fillStyle = g; ctx.fillRect(0,0,Wc,hy);
      var gl = ctx.createRadialGradient(cx,hy,0,cx,hy,Wc*0.9);
      gl.addColorStop(0,"rgba(220,100,0,.55)"); gl.addColorStop(1,"rgba(220,100,0,0)");
      ctx.fillStyle = gl; ctx.fillRect(0,0,Wc,Hc);
      ctx.fillStyle = "#121010"; ctx.fillRect(0,hy,Wc,Hc-hy);
      var spread = Wc*0.9;
      ctx.beginPath(); ctx.moveTo(cx,hy); ctx.lineTo(cx+spread,Hc); ctx.lineTo(cx-spread,Hc); ctx.closePath(); ctx.fillStyle = "#1E1B1A"; ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#EDE8E3"; ctx.beginPath(); ctx.moveTo(cx-2,hy); ctx.lineTo(cx-spread*0.86,Hc); ctx.stroke();
      ctx.strokeStyle = "#DC6400"; ctx.beginPath(); ctx.moveTo(cx+2,hy); ctx.lineTo(cx+spread*0.86,Hc); ctx.stroke();
      var dist = 3*t + 3.2*t*t; ctx.fillStyle = "#F7F2EA";
      for (var k = 0; k < 40; k++){
        var z0 = (k*2 - (dist % 2)), z1 = z0 + 1; if (z1 <= 0.15) continue;
        var y0 = hy + (Hc-hy)*0.81/Math.max(z0,0.15), y1 = hy + (Hc-hy)*0.81/z1; if (y1 > Hc) continue;
        var w0 = Math.max(1,(y0-hy)/(Hc-hy)*9), w1 = Math.max(.5,(y1-hy)/(Hc-hy)*9);
        ctx.beginPath(); ctx.moveTo(cx-w1/2,y1); ctx.lineTo(cx+w1/2,y1); ctx.lineTo(cx+w0/2,Math.min(y0,Hc)); ctx.lineTo(cx-w0/2,Math.min(y0,Hc)); ctx.closePath(); ctx.fill();
      }
      var fog = ctx.createLinearGradient(0,hy-4,0,hy+Hc*0.18); fog.addColorStop(0,"rgba(120,55,10,.85)"); fog.addColorStop(1,"rgba(120,55,10,0)");
      ctx.fillStyle = fog; ctx.fillRect(0,hy-4,Wc,Hc*0.18);
    }
    function finish(){
      if (done) return; done = true;
      try { sessionStorage.setItem("cpc-intro","1"); } catch(e){}
      root.classList.remove("intro-on"); root.classList.add("intro-done");
      box.style.opacity = "0"; setTimeout(function(){ box.hidden = true; }, 520);
    }
    document.getElementById("skip").addEventListener("click", function(){ snd("tap"); finish(); });
    function step(ts){
      if (done) return;
      if (t0 === null) t0 = ts;
      var t = FIX ? parseFloat(FIX) : (ts - t0)/1000;
      ctx.clearRect(0,0,Wc,Hc);
      /* road, then a band of light rises from the bottom of the screen to the top and wipes it away */
      var r = prog(t, DRIVE, RISE), bandY = Hc*(1.12 - r*1.36);
      if (t < RISE + .05){
        road(t);
        if (r > 0){ ctx.fillStyle = "#0B0908"; ctx.fillRect(0, bandY + Hc*0.12, Wc, Hc); }
      } else { ctx.fillStyle = "#0B0908"; ctx.fillRect(0,0,Wc,Hc); }
      beam.style.opacity = (r > 0 && r < 1) ? Math.sin(r*Math.PI).toFixed(3) : "0";
      beam.style.top = (bandY - Hc*0.12) + "px";
      /* logo box: big in the middle, later flies to the header */
      /* where the logo is actually drawn inside the header svg box (the box can be wider than the drawing) */
      var hb = headLogo.getBoundingClientRect(), vb = headLogo.viewBox.baseVal, k = Math.min(hb.width / vb.width, hb.height / vb.height);
      var tr = {width: vb.width * k, left: hb.left + (hb.width - vb.width * k) / 2, top: hb.top + (hb.height - vb.height * k) / 2};
      var bigW = Math.min(Wc*0.86, 520), bx = (Wc-bigW)/2, by = Hc*0.40 - bigW*0.2;
      var fl = ease(prog(t, FLY, END - .2));
      var w = bigW*(1-fl) + tr.width*fl, x = bx*(1-fl) + tr.left*fl, y = by*(1-fl) + tr.top*fl;
      il.style.width = w + "px"; il.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
      /* 1) the road mark is drawn bottom -> top with a light travelling up it */
      var s = ease(prog(t, SW0, SW1));
      if (s > 0){ el.sw.style.opacity = "1"; el.sw.style.clipPath = el.sw.style.webkitClipPath = clip("sw", (1 - s)*100); }
      gh.style.opacity = (s > 0 && s < 1) ? (Math.sin(s*Math.PI)).toFixed(3) : "0";
      gh.style.left = "8.5%"; gh.style.top = ((1 - s)*100) + "%";
      /* 2) C - P - C drive in from the right */
      ["c1","p","c2"].forEach(function(k, i){
        var q = prog(t, L0 + i*.15, L0 + .55 + i*.15);
        el[k].style.opacity = ease(q).toFixed(3);
        el[k].style.transform = "translateX(" + ((1 - back(q))*30).toFixed(2) + "%)";
      });
      /* 3) Arabic, then English name rise in */
      [["ar", AR0], ["en", EN0]].forEach(function(a){
        var q = ease(prog(t, a[1], a[1] + .5));
        el[a[0]].style.opacity = q.toFixed(3); el[a[0]].style.transform = "translateY(" + ((1-q)*6).toFixed(2) + "%)";
      });
      box.style.backgroundColor = "rgba(11,9,8," + (1 - fl).toFixed(3) + ")";
      if (fl > 0){ root.classList.add("intro-done"); cv.style.opacity = (1 - fl).toFixed(3); }
      if (FIX){ return; }
      if (t >= END){ finish(); return; }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
})();
